# Mosquitto MQTT Broker — configuração local ELEX20
# Para produção: desabilitar allow_anonymous e configurar password_file

listener 1883

# Permite conexões anônimas na rede local (ESP32 sem credenciais)
# Em produção: mudar para false e descomentar as linhas abaixo
allow_anonymous true
# password_file /mosquitto/config/passwd
# acl_file      /mosquitto/config/acl

# Persistência de mensagens entre reinicializações
persistence true
persistence_location /mosquitto/data/

# Log para arquivo e stdout
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Tamanho máximo de mensagem: 256 KB (suficiente para janelas de amostras brutas)
message_size_limit 262144

# Keepalive do cliente: 60 s
# O ESP32 deve configurar keepalive <= 60 s no PubSubClient
