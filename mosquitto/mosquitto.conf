# Mosquitto MQTT Broker — configuração ELEX20
#
# Autenticação e ACL por listener. O arquivo de senhas é gerado na subida do
# container por mosquitto/entrypoint.sh a partir de MQTT_DEVICE_PASS e MQTT_N8N_PASS.
per_listener_settings true

# ── Listener principal (ESP32 e n8n) ────────────────────────────────────────
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file      /mosquitto/config/acl

# ── Listener de healthcheck: só loopback do container, nunca publicado ──────
# O ACL só permite escrever no tópico "health", que nenhum usuário do 1883 lê.
listener 1884 127.0.0.1
allow_anonymous true
acl_file /mosquitto/config/acl-health

# Persistência de mensagens entre reinicializações
persistence true
persistence_location /mosquitto/data/

# Log para arquivo e stdout
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Tamanho máximo de mensagem: 2 KB. O firmware publica JSON de ~100 bytes
# (inferência e status); janelas de áudio brutas não passam por aqui.
message_size_limit 2048

# Keepalive do cliente: 60 s
# O ESP32 deve configurar keepalive <= 60 s no PubSubClient
