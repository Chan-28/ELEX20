apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    uid: timescaledb
    url: timescaledb:5432
    database: ${POSTGRES_DB}
    # Papel somente leitura criado por timescaledb/db-init.sql (nunca o superusuário)
    user: grafana_ro
    secureJsonData:
      password: $__file{/run/secrets/grafana_ro/value}
    jsonData:
      database: ${POSTGRES_DB}
      # O TimescaleDB não tem TLS e o tráfego não sai da rede interna 'monitoring'
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    editable: false
