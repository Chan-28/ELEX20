[project]
name = "Oficinas-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chan", email = "honglikch@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "bleak>=3.0.2",
    "colorama>=0.4.6",
    "ipython>=9.17.1",
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "multidict>=6.9.1",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pylsl>=1.18.5",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tokenize-rt>=6.2.0",
    "typing-extensions>=4.16.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "winloop>=0.7.0; sys_platform == 'win32'",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "ruff>=0.16.9",
]
[tool.ruff]
# Ativa algumas das melhores regras do ecossistema Python 
select = [
    "E", "F",   # Padrão do Ruff (Erros e Estilo)
    "I",        # Organização de Imports (isort)
    "B",        # Prevenção de Bugs (Bugbear)
    "S",        # Checagem de Segurança (Bandit)
    "UP",       # Sintaxe moderna (Pyupgrade)
    "C4",       # Comprehensions mais rápidas
    "ARG",      # Remove argumentos não usados
    "N"         # Padronização de nomes (PEP 8)
]

ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
