[project]
name = "elex20"
version = "1.2.0"
description = "Monitoramento de sons urbanos — ESP32-S3 + Edge Impulse + TimescaleDB + Grafana"
readme = "README.md"
authors = [
    { name = "Chan-28" }
]
requires-python = ">=3.11"
dependencies = [
    # Ferramentas do Hermes (hermes/mcp/elex_db.py): consultas ao TimescaleDB
    "asyncpg>=0.30.0",
    # Simulador de sensores (debug/simulate_sensor.py)
    "paho-mqtt>=2.1.0",
    # Análise de áudio e de métricas (debug/, training/)
    "numpy>=2.4.6",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
debug = [
    "pyserial>=3.5",
]
dev = [
    "ruff>=0.16.9",
    "pytest>=9.2.0",
    { include-group = "installer" },
]
installer = [
    "textual==8.2.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F",   # erros e estilo
    "I",        # organização de imports
    "B",        # prevenção de bugs
    "S",        # segurança
    "UP",       # sintaxe moderna
    "C4",       # comprehensions
    "ARG",      # argumentos não usados
    "N",        # PEP 8
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert é o idioma do pytest; senhas fictícias

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["hermes/mcp", "installer", "debug"]
testpaths = ["tests"]
