[project]
name = "elex20"
version = "0.2.0"
description = "Monitoramento de sons urbanos — ESP32-S3 + Edge Impulse + TimescaleDB + Grafana"
readme = "README.md"
authors = [
    { name = "Chan", email = "honglikch@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Acesso ao TimescaleDB / PostgreSQL (scripts de admin e análise)
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    # MQTT — utilitários de teste e ingestão alternativa
    "paho-mqtt>=2.1.0",
    # HTTP assíncrono (integrações, webhooks)
    "aiohttp>=3.14.4",
    # Análise de dados leve (consultas, agregações)
    "numpy>=2.4.6",
    "pandas>=2.3.0",
    # Utilitários
    "colorama>=0.4.6",
    "python-dotenv>=1.1.0",
    "typing-extensions>=4.16.0",
    # Loop assíncrono nativo por plataforma
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "winloop>=0.7.0; sys_platform == 'win32'",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "black>=26.5.1",
    "isort>=9.0.1",
    "ruff>=0.16.9",
    "mypy>=1.15.0",
    "scipy-stubs>=1.5.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F",   # erros e estilo
    "I",        # organização de imports
    "B",        # prevenção de bugs
    "S",        # segurança
    "UP",       # sintaxe moderna
    "C4",       # comprehensions
    "ARG",      # argumentos não usados
    "N",        # PEP 8
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"dependencies.py" = ["S603", "S607", "S110"]
"tests/*.py" = ["S101", "N802"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
exclude = ["hermes_data"]

