name: Firmware CI (PlatformIO)

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Variáveis dummy para satisfazer os build_flags (-DWIFI_SSID=...)
      # O firmware não é executado em CI, apenas compilado.
      - name: Build firmware (syntax + dependency check)
        working-directory: firmware
        env:
          WIFI_SSID: "CI_DUMMY"
          WIFI_PASS: "CI_DUMMY"
          MQTT_HOST: "127.0.0.1"
        run: pio run --environment esp32dev

      - name: Upload firmware artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32dev
          path: firmware/.pio/build/esp32dev/firmware.bin
          retention-days: 30

  # ── Trivy scan da imagem base do Mosquitto ───────────────────
  trivy-mosquitto:
    name: Trivy — eclipse-mosquitto:2
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Pull Mosquitto image
        run: docker pull eclipse-mosquitto:2

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eclipse-mosquitto:2
          format: sarif
          output: trivy-mosquitto.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-mosquitto.sarif
          category: trivy-mosquitto
