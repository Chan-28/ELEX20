name: Firmware CI (PlatformIO)

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install PlatformIO
        run: uv tool install platformio

      # Variáveis dummy para satisfazer os build_flags (-DWIFI_SSID=...)
      # O firmware não é executado em CI, apenas compilado.
      - name: Build firmware (syntax + dependency check)
        working-directory: firmware
        env:
          WIFI_SSID: "CI_DUMMY"
          WIFI_PASS: "CI_DUMMY"
          MQTT_HOST: "127.0.0.1"
        run: pio run --environment esp32s3

      - name: Upload firmware artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-esp32s3
          path: firmware/.pio/build/esp32s3/firmware.bin
          retention-days: 30

  # Análise estática (cppcheck via PlatformIO) do código do firmware
  static-analysis:
    name: Static analysis (pio check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install PlatformIO
        run: uv tool install platformio

      # Mesmas variáveis dummy do build: os build_flags as exigem.
      # --skip-packages: analisa só o código do projeto, não as libs.
      - name: Run pio check
        working-directory: firmware
        env:
          WIFI_SSID: "CI_DUMMY"
          WIFI_PASS: "CI_DUMMY"
          MQTT_HOST: "127.0.0.1"
        run: pio check --environment esp32s3 --skip-packages --severity=medium --fail-on-defect=high
