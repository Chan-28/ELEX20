name: Firmware CI (PlatformIO)

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install PlatformIO
        run: uv tool install platformio

      # Variáveis dummy para satisfazer os build_flags (-DWIFI_SSID=...)
      # O firmware não é executado em CI, apenas compilado.
      - name: Build firmware (syntax + dependency check)
        working-directory: firmware
        env:
          WIFI_SSID: "CI_DUMMY"
          WIFI_PASS: "CI_DUMMY"
          MQTT_HOST: "127.0.0.1"
          MQTT_USER: "CI_DUMMY"
          MQTT_PASS: "CI_DUMMY"
        run: pio run --environment esp32s3

      - name: Upload firmware artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-esp32s3
          path: firmware/.pio/build/esp32s3/firmware.bin
          retention-days: 30

  # Testes sem hardware: direção do som, comandos e urgência (lib/elex_core)
  native-tests:
    name: Unit tests (pio test -e native)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install PlatformIO
        run: uv tool install platformio

      - name: Run native tests
        working-directory: firmware
        run: pio test --environment native

  # Análise estática (cppcheck via PlatformIO) do código do firmware
  static-analysis:
    name: Static analysis (pio check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install PlatformIO
        run: uv tool install platformio

      # Mesmas variáveis dummy do build: os build_flags as exigem.
      # --skip-packages: analisa só o código do projeto, não as libs.
      - name: Run pio check
        working-directory: firmware
        env:
          WIFI_SSID: "CI_DUMMY"
          WIFI_PASS: "CI_DUMMY"
          MQTT_HOST: "127.0.0.1"
          MQTT_USER: "CI_DUMMY"
          MQTT_PASS: "CI_DUMMY"
        run: pio check --environment esp32s3 --skip-packages --severity=medium --fail-on-defect=high
