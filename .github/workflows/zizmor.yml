name: Zizmor (workflow security linter)

# Análise estática dos próprios workflows do GitHub Actions: injeção via
# expressões, permissões excessivas, actions sem versão fixa, uso inseguro de
# issue_comment/pull_request_target etc. Achados vão para o GitHub Security.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  schedule:
    # Toda segunda às 12:00 UTC (regras novas do zizmor)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload do SARIF ao GitHub Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
