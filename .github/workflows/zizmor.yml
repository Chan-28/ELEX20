name: Zizmor (segurança dos workflows)

# Análise estática dos próprios workflows do GitHub Actions: injeção via
# expressões, permissões excessivas, actions sem versão fixa, uso inseguro de
# issue_comment/pull_request_target etc. Achados vão para o GitHub Security.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  schedule:
    # Toda segunda às 12:00 UTC (regras novas do zizmor)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload do SARIF ao GitHub Security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
