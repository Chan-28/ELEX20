name: CI — Python Lint & Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint & format check
  # ─────────────────────────────────────────────
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dev dependencies
        run: uv sync --group dev --frozen

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check .

  # ─────────────────────────────────────────────
  # 2. Auditoria de segurança das dependências Python
  # ─────────────────────────────────────────────
  dependency-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Run pip-audit against lock file
        run: |
          uv export --frozen --no-dev -o /tmp/requirements-audit.txt
          uv tool run pip-audit \
            --requirement /tmp/requirements-audit.txt \
            --output-format cyclonedx-json \
            > pip-audit-report.json || true

      - name: Fail on CRITICAL CVEs
        run: |
          uv tool run pip-audit \
            --requirement /tmp/requirements-audit.txt \
            --severity CRITICAL \
            --strict
        continue-on-error: false

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  # ─────────────────────────────────────────────
  # 3. Verifica consistência do uv.lock
  # ─────────────────────────────────────────────
  lock-check:
    name: uv.lock consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Check lock file is up to date
        run: uv lock --check

  # ─────────────────────────────────────────────
  # 4. Testes + cobertura
  # ─────────────────────────────────────────────
  test:
    name: Pytest + Coverage
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v --tb=short \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --ignore=tests/verificar_stream.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
