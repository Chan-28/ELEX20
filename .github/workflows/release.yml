name: Automated Release & Signing Process

on:
  push:
    tags:
      - 'v*' # Dispara o processo sempre que enviar uma tag começando com 'v' (ex: v1.0.0)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write    
      id-token: write    # Obrigatório para a assinatura Keyless (OIDC) funcionar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign (Keyless Signing)
        uses: sigstore/cosign-installer@v3.5.0

      # Simulação de build do software e gera um arquivo de release (ex: tar.gz) para ser assinado
      - name: Release Build Simulation
        run: |
          echo " Software release version ${{ github.ref_name }}" > meu-app-${{ github.ref_name }}.txt
          tar -czvf release-artifact.tar.gz meu-app-${{ github.ref_name }}.txt

      # Assina o arquivo
      - name: Sign the release artifacts
        run: |
          cosign sign-blob --yes --output-signature release-artifact.tar.gz.sig release-artifact.tar.gz

      # Cria a página de Release no GitHub e anexa o arquivo junto com a assinatura dele
      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifact.tar.gz
            release-artifact.tar.gz.sig
          body: |
            Automated release generated via GitHub Actions.
            
            **Check the integrity of this file:**
            ```bash
            cosign verify-blob --certificate-identity-regexp "https://github.com" --oidc-issuer https://githubusercontent.com --signature release-artifact.tar.gz.sig release-artifact.tar.gz
            ```