name: Automated Release & Signing Process

on:
  push:
    tags:
      - 'v*' # Dispara o processo sempre que enviar uma tag começando com 'v' (ex: v1.0.0)

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a release e anexar os arquivos
      id-token: write # obrigatório para a assinatura keyless (OIDC) funcionar

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign (Keyless Signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Pacote real: o código-fonte da tag (respeita export-ignore do .gitattributes).
      # O nome da tag vem por env, nunca interpolado direto no script.
      - name: Package source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="elex20-${TAG}/" -o "elex20-${TAG}.tar.gz" HEAD
          sha256sum "elex20-${TAG}.tar.gz" > "elex20-${TAG}.tar.gz.sha256"

      # Assina o arquivo. O bundle reúne assinatura, certificado e entrada no Rekor,
      # tudo o que a verificação keyless precisa.
      - name: Sign the release artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cosign sign-blob --yes --bundle "elex20-${TAG}.tar.gz.sigstore.json" "elex20-${TAG}.tar.gz"

      # Cria a página de Release no GitHub e anexa o arquivo, o hash e a assinatura
      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            elex20-${{ github.ref_name }}.tar.gz
            elex20-${{ github.ref_name }}.tar.gz.sha256
            elex20-${{ github.ref_name }}.tar.gz.sigstore.json
          body: |
            Automated release generated via GitHub Actions (source archive of this tag).

            **Verify the integrity and origin of the archive:**
            ```bash
            cosign verify-blob \
              --bundle elex20-${{ github.ref_name }}.tar.gz.sigstore.json \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              elex20-${{ github.ref_name }}.tar.gz
            ```

            **Instalador:** baixe o arquivo `elex-instalador-<sistema>` do seu computador
            (Windows, macOS ou Linux), execute-o e siga as perguntas. Precisa do Docker
            instalado; o instalador explica como instalar se faltar. Cada arquivo tem
            `.sha256` e `.sigstore.json` (verificação igual à do código-fonte acima).

  # Executáveis do instalador: um por sistema, anexados à mesma release
  installer:
    name: Instalador (${{ matrix.asset }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write # anexar os arquivos à release
      id-token: write # assinatura keyless (OIDC)
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc antigo: o binário roda em Ubuntu, Debian, Mint, Fedora, Arch, openSUSE...
          - runner: ubuntu-22.04
            asset: elex-instalador-linux-x86_64
          - runner: ubuntu-22.04-arm
            asset: elex-instalador-linux-arm64
          - runner: windows-latest
            asset: elex-instalador-windows-x86_64.exe
          - runner: macos-latest
            asset: elex-instalador-macos-arm64
          - runner: macos-15-intel
            asset: elex-instalador-macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install Cosign (Keyless Signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build, hash and sign
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          uvx --from "pyinstaller>=6.11" pyinstaller installer/elex_instalador.spec --noconfirm
          if [ -f dist/elex-instalador.exe ]; then mv dist/elex-instalador.exe "dist/${ASSET}"; else mv dist/elex-instalador "dist/${ASSET}"; fi
          "./dist/${ASSET}" --versao
          python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p.split('/')[-1])" "dist/${ASSET}" > "dist/${ASSET}.sha256"
          cosign sign-blob --yes --bundle "dist/${ASSET}.sigstore.json" "dist/${ASSET}"

      - name: Attach to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
            dist/${{ matrix.asset }}.sigstore.json
