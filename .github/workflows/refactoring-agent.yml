name: PR Refactoring Agent

on:
  issue_comment:
    types: [created]

jobs:
  refactor:
    # Só quem tem acesso ao repositório pode acionar o agente (escreve no PR e usa secrets).
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/cs-agent') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: codescene-oss/pr-refactoring-agent@449879a10a469bf80a9bf202e64ffc860679d2b4 # v1.1.9
        with:
          pr_number: ${{ github.event.issue.number }}
          command: ${{ github.event.comment.body }}
          model: 'anthropic/claude-sonnet-4-6-20251101'
          codescene_token: ${{ secrets.CODESCENE_ACCESS_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}