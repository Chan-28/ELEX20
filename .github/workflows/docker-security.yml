name: Docker Security & Deploy

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yaml"
      - ".github/workflows/docker-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yaml"
  schedule:
    # Varredura semanal toda segunda às 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # necessário para upload ao GitHub Security

jobs:
  # ─────────────────────────────────────────────
  # 1. Valida sintaxe do docker-compose.yaml
  # ─────────────────────────────────────────────
  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y docker-compose-plugin

      - name: Validate syntax
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Check for required env vars
        run: |
          REQUIRED=(
            POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB
            GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD
          )
          for var in "${REQUIRED[@]}"; do
            if ! grep -q "\${${var}}" docker-compose.yaml; then
              echo "::warning ::Variável \${${var}} não referenciada no compose"
            fi
          done

  # ─────────────────────────────────────────────
  # 2. Escaneia segredos no repositório
  # ─────────────────────────────────────────────
  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo para detectar segredos antigos

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────
  # 3. Trivy — varre cada imagem do compose
  # ─────────────────────────────────────────────
  trivy-scan:
    name: Trivy Image Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "timescale/timescaledb:latest-pg16"
            alias: timescaledb
          - image: "docker.n8n.io/n8nio/n8n:latest"
            alias: n8n
          - image: "ollama/ollama:latest"
            alias: ollama
          - image: "grafana/grafana:latest"
            alias: grafana
          - image: "grafana/loki:latest"
            alias: loki
          - image: "grafana/alloy:latest"
            alias: alloy
          - image: "grafana/pyroscope:latest"
            alias: pyroscope

    steps:
      - uses: actions/checkout@v4

      - name: Pull image
        run: docker pull ${{ matrix.image }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.alias }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"       # não falha o build, apenas reporta
          ignore-unfixed: true # ignora CVEs sem fix disponível

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.alias }}.sarif
          category: trivy-${{ matrix.alias }}

      - name: Run Trivy (table summary — PR comment)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"   # falha se encontrar CRITICAL sem fix

  # ─────────────────────────────────────────────
  # 4. Trivy — varre o docker-compose como IaC
  # ─────────────────────────────────────────────
  trivy-config:
    name: Trivy IaC / Config Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan docker-compose.yaml for misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: docker-compose.yaml
          format: sarif
          output: trivy-config.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ─────────────────────────────────────────────
  # 5. Resume final — falha se algum job crítico falhou
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [validate-compose, secrets-scan, trivy-config]
    if: always()
    steps:
      - name: Check results
        run: |
          RESULTS='${{ toJSON(needs) }}'
          FAILED=$(echo "$RESULTS" | grep -c '"result": "failure"' || true)
          if [ "$FAILED" -gt 0 ]; then
            echo "::error ::$FAILED job(s) de segurança falharam. Revise os resultados acima."
            exit 1
          fi
          echo "✅ Todos os checks de segurança passaram."
