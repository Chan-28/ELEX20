name: Docker Security & Deploy

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yaml"
      - ".github/workflows/docker-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yaml"
  schedule:
    # Varredura às 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read # security-events: write só nos jobs que enviam SARIF

jobs:
  # 1. Valida sintaxe do docker-compose.yaml

  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # O Docker Compose já vem instalado no ubuntu-latest.
      - name: Validate syntax
        env:
          # Variáveis obrigatórias sem valor no .env.example (não têm senha padrão)
          GRAFANA_RO_PASSWORD: ci-dummy
          N8N_DB_PASSWORD: ci-dummy
          MQTT_DEVICE_PASS: ci-dummy
          MQTT_N8N_PASS: ci-dummy
        run: docker compose --env-file .env.example -f docker-compose.yaml config --quiet

      - name: Check for required env vars
        run: |
          REQUIRED=(
            POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB
            GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD
          )
          for var in "${REQUIRED[@]}"; do
            if ! grep -q "\${${var}}" docker-compose.yaml; then
              echo "::warning ::Variável \${${var}} não referenciada no compose"
            fi
          done

  # 2. Escaneia "leaks" no repositório

  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo para detectar segredos antigos
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # 3. Varre cada imagem do compose

  grype-scan:
    name: Grype Image Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload do SARIF ao GitHub Security
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "timescale/timescaledb:2.31.0-pg16"
            alias: timescaledb
          - image: "docker.n8n.io/n8nio/n8n:2.46.3"
            alias: n8n
          - image: "ollama/ollama:0.40.13"
            alias: ollama
          - image: "grafana/grafana:13.3.0"
            alias: grafana
          - image: "grafana/loki:3.7.9"
            alias: loki
          - image: "grafana/alloy:v1.21.3"
            alias: alloy
          - image: "grafana/pyroscope:2.4.2"
            alias: pyroscope
          - image: "eclipse-mosquitto:2.1.2-alpine"
            alias: mosquitto
          - image: "lightpanda/browser:1.0.2"
            alias: lightpanda
          - image: "nousresearch/hermes-agent:v0.22.5"
            alias: hermes-agent

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Grype vulnerability scan
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.image }}
          output-format: sarif
          severity-cutoff: high
          only-fixed: true # ignora CVEs sem fix disponível
          fail-build: false # não falha o build, apenas reporta
          cache-db: true

      - name: Upload SARIF to GitHub Security
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-${{ matrix.alias }}

      - name: Run Grype (table summary)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.image }}
          output-format: table
          severity-cutoff: high
          only-fixed: true
          fail-build: false # reporta sem falhar — CVEs são de imagens upstream
          cache-db: true

  # 4. Varre o docker-compose como IaC

  trivy-config:
    name: Trivy IaC / Config Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload do SARIF ao GitHub Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan docker-compose.yaml for misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: docker-compose.yaml
          format: sarif
          output: trivy-config.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # 5. OWASP ZAP baseline (passivo) contra Grafana e n8n

  zap-baseline:
    name: OWASP ZAP Baseline (${{ matrix.alias }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - alias: grafana
            url: "http://localhost:3000"
          - alias: n8n
            url: "http://localhost:5678"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stack efêmera no runner, com os valores de exemplo do .env.example.
      # O compose já publica Grafana/n8n em 127.0.0.1; o ZAP usa --network host.
      - name: Up service stack
        env:
          GRAFANA_RO_PASSWORD: ci-dummy
          N8N_DB_PASSWORD: ci-dummy
          MQTT_DEVICE_PASS: ci-dummy
          MQTT_N8N_PASS: ci-dummy
        run: |
          cp .env.example .env
          docker compose up -d --wait timescaledb ${{ matrix.alias }}
          for i in $(seq 1 30); do
            curl -sS --max-time 5 -o /dev/null "${{ matrix.url }}" && exit 0
            sleep 5
          done
          echo "::error ::${{ matrix.alias }} did not respond in ${{ matrix.url }}"
          exit 1

      - name: Target diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=60 ${{ matrix.alias }}
          docker inspect ${{ matrix.alias }} --format '{{json .State.Health}}' || true
          curl -v --max-time 5 "${{ matrix.url }}" || true

      - name: Run ZAP baseline
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          # -I: avisos não falham o job (achados de produto upstream)
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${{ matrix.url }}" \
            -r zap-${{ matrix.alias }}.html -J zap-${{ matrix.alias }}.json -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-${{ matrix.alias }}
          path: zap-out/
          retention-days: 30

      - name: Down service stack
        if: always()
        env:
          GRAFANA_RO_PASSWORD: ci-dummy
          N8N_DB_PASSWORD: ci-dummy
          MQTT_DEVICE_PASS: ci-dummy
          MQTT_N8N_PASS: ci-dummy
        run: docker compose down

  # 6. Resumo final

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [validate-compose, secrets-scan, trivy-config]
    if: always()
    steps:
      - name: Check results
        run: |
          RESULTS='${{ toJSON(needs) }}'
          FAILED=$(echo "$RESULTS" | grep -c '"result": "failure"' || true)
          if [ "$FAILED" -gt 0 ]; then
            echo "::error ::$FAILED security checks failed."
            exit 1
          fi
          echo "✅ All security checks passed."
