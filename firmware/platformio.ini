; ─────────────────────────────────────────────────────────────
; ELEX20 — Firmware ESP32 com Edge Impulse + MQTT
;
; Pré-requisitos:
;   1. Exportar modelo do Edge Impulse:
;      Project → Deployment → Arduino library → Download .zip
;      Extrair em firmware/lib/ei-model/
;   2. Copiar firmware/.env.example → firmware/.env e preencher
; ─────────────────────────────────────────────────────────────

[platformio]
default_envs = esp32dev

; ── Variáveis de ambiente (lidas de firmware/.env via extra_scripts)
; Alternativa: definir diretamente em [env:esp32dev] > build_flags
[env]
build_flags =
    -DARDUINO_ARCH_ESP32

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600

lib_deps =
    ; MQTT client
    knolleary/PubSubClient @ ^2.8
    ; JSON serialization leve para ESP32
    bblanchon/ArduinoJson @ ^7.2.0
    ; ADS1115 ADC (mesmo chip do sketch BLE original)
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    ; LCD HD44780 via I2C (PCF8574)
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    ; Edge Impulse SDK — coloque o .zip exportado em lib/ei-model/
    ; PlatformIO detecta automaticamente bibliotecas em lib/

lib_extra_dirs =
    lib/

build_flags =
    ${env.build_flags}
    ; ── Credenciais WiFi e MQTT (definir no ambiente CI ou via firmware/.env)
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DMQTT_HOST=\"${sysenv.MQTT_HOST}\"
    -DMQTT_PORT=1883
    ; ── Tópicos MQTT
    -DMQTT_TOPIC_INFERENCE=\"emg/inference\"
    -DMQTT_TOPIC_STATUS=\"emg/status\"
    -DMQTT_TOPIC_RAW=\"emg/raw\"
    ; ── Identificação do dispositivo
    -DDEVICE_ID=\"esp32-emg-01\"
    ; ── Tamanho da janela de inferência (amostras) — ajustar ao modelo EI exportado
    -DEI_WINDOW_SIZE=500
    ; ── Taxa de amostragem do ADS1115 (Hz)
    -DSAMPLE_RATE_HZ=500

[env:esp32dev_debug]
extends        = env:esp32dev
build_type     = debug
monitor_filters = esp32_exception_decoder
build_flags    =
    ${env:esp32dev.build_flags}
    -DCORE_DEBUG_LEVEL=4
    -DDEBUG_MQTT=1
