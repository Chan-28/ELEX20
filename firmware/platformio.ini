; ─────────────────────────────────────────────────────────────
; ELEX20 — Firmware ESP32-S3 com Edge Impulse (áudio) + MQTT
;
; Hardware: ESP32-S3 + microfone I2S (ex: INMP441, MSM261S)
;
; Pré-requisitos:
;   1. Treinar modelo no Edge Impulse (classificação de áudio,
;      MFCC ou MFE, 16 kHz, janela ≥ 1 s)
;   2. Exportar: Deployment → Arduino library → Download .zip
;      Extrair em firmware/lib/ei-model/
;      O header gerado terá o nome do projeto, ex:
;        firmware/lib/ei-model/ei-<nome>-arduino-x.x.x/
;   3. Ajustar EI_MODEL_HEADER em build_flags abaixo
;   4. Copiar firmware/.env.example → firmware/.env e preencher
; ─────────────────────────────────────────────────────────────

[platformio]
default_envs = esp32s3

[env]
build_flags =
    -DARDUINO_ARCH_ESP32

; ── Board: ESP32-S3 DevKit C1 (Espressif oficial)
; Troque pelo board exato do seu kit se necessário:
;   lolin_s3          → Wemos/LOLIN S3
;   esp32s3box        → ESP32-S3-BOX
;   adafruit_feather_esp32s3 → Adafruit Feather S3
[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; PSRAM habilitado (ESP32-S3 tem até 8 MB PSRAM — útil para buffer de áudio)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size          = 8MB
board_build.partitions           = default_8MB.csv

monitor_speed  = 115200
upload_speed   = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    ; MQTT
    knolleary/PubSubClient @ ^2.8
    ; JSON
    bblanchon/ArduinoJson @ ^7.2.0
    ; Edge Impulse SDK — colocar o .zip exportado em lib/ei-model/
    ; PlatformIO detecta automaticamente libs em lib/

lib_extra_dirs =
    lib/

build_flags =
    ${env.build_flags}
    ; ── Credenciais (injetadas via sysenv do firmware/.env ou CI secrets)
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DMQTT_HOST=\"${sysenv.MQTT_HOST}\"
    -DMQTT_PORT=1883
    ; ── Tópicos MQTT
    -DMQTT_TOPIC_INFERENCE=\"sound/inference\"
    -DMQTT_TOPIC_STATUS=\"sound/status\"
    ; ── Identificação do dispositivo
    -DDEVICE_ID=\"esp32s3-sound-01\"
    ; ── Microfone I2S — ajuste os pinos ao seu hardware
    -DI2S_WS_PIN=42
    -DI2S_SCK_PIN=40
    -DI2S_SD_PIN=41
    ; ── Áudio: taxa de amostragem e tamanho do buffer
    ; Deve coincidir com o sample rate configurado no Edge Impulse (16000 Hz)
    -DAUDIO_SAMPLE_RATE=16000
    ; Tamanho da janela em ms (ex: 1000 ms = 1 s de áudio)
    ; Deve coincidir exatamente com a janela definida no projeto EI
    -DAUDIO_WINDOW_MS=975
    ; ── Header do modelo Edge Impulse exportado
    ; Ajuste para o nome real gerado pelo EI, ex: "meu_projeto_inferencing.h"
    -DEI_MODEL_HEADER="ei-model_inferencing.h"

[env:esp32s3_debug]
extends        = env:esp32s3
build_type     = debug
build_flags    =
    ${env:esp32s3.build_flags}
    -DCORE_DEBUG_LEVEL=4
    -DDEBUG_AUDIO=1
