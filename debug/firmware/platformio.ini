; ─────────────────────────────────────────────────────────────
; ELEX20 — firmware de bancada para debug (não vai para o sensor em uso)
;
; Sem Wi-Fi nem modelo: lê os 4 microfones, imprime a qualidade de cada um,
; grava o áudio pela USB e aciona os motores por comando na serial.
; Use com debug/mic_check.py. Pinos iguais aos de firmware/platformio.ini
; (tests/test_debug_tools.py confere).
;
;   pio run -t upload && pio device monitor     (a partir de debug/firmware)
; ─────────────────────────────────────────────────────────────

[platformio]
default_envs = esp32s3_bench

[env:esp32s3_bench]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_upload.flash_size          = 16MB
board_upload.maximum_size        = 16777216
board_build.partitions           = default_16MB.csv

; 2 Mbaud: cabem os 4 canais a 16 kHz (128 KB/s). Se o conversor USB da placa não
; aguentar, grave só a mistura (rec 1) ou baixe para 921600 aqui e no mic_check.py.
monitor_speed  = 2000000
upload_speed   = 921600
monitor_filters = esp32_exception_decoder

; elex_core (estatística dos microfones) vem do firmware principal
lib_extra_dirs = ../../firmware/lib

build_flags =
    -DARDUINO_ARCH_ESP32
    -DDEBUG_BAUD=2000000
    -DAUDIO_SAMPLE_RATE=16000
    ; ── Microfone I2S (iguais a firmware/platformio.ini)
    -DI2S_WS_PIN=5
    -DI2S_SCK_PIN=4
    -DI2S_SD_PIN=6
    -DI2S1_SD_PIN=7
    ; ── Motores: frente, direita, trás, esquerda (iguais a firmware/platformio.ini)
    -DMOTOR_PIN_FRONT=18
    -DMOTOR_PIN_RIGHT=17
    -DMOTOR_PIN_BACK=16
    -DMOTOR_PIN_LEFT=15
